name: Deploy WeedBot

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-weedbot
  cancel-in-progress: true

jobs:
  deploy-oracle:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            LOGFILE=~/WeedBot/deploy.log
            echo "===== $(date '+%Y-%m-%d %H:%M:%S') 배포 시작 =====" >> $LOGFILE
            cd ~/WeedBot
            git pull origin master 2>&1 | tee -a $LOGFILE
            pnpm install --frozen-lockfile 2>&1 | tee -a $LOGFILE
            pnpm build 2>&1 | tee -a $LOGFILE
            pm2 startOrReload ecosystem.config.cjs --update-env 2>&1 | tee -a $LOGFILE
            echo "✅ $(date '+%Y-%m-%d %H:%M:%S') 배포 완료" | tee -a $LOGFILE
